name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (no network, no API key)
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          python eval.py --help
          python -c 'import eval; c = eval.load_cases(eval.CASES); print(len(c), "cases,", len({x["kind"] for x in c}), "grading kinds")'
